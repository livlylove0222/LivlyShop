<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/LivlyShop/favicon.ico">
  <title>FF14 魔晶石資產清理助手</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel-bg: #ffffff;
      --border: #eef0f2;
      --text1: #2c3e50;
      --text2: #34495e;
      --text3: #7f8c8d;
      --primary: #3498db;
      --primary-hover: #2980b9;
      --badge-high: #e8f8f5;
      --text-high: #1abc9c;
      --badge-low: #fdf2e9;
      --text-low: #e67e22;
      --alert-bg: #fdedec; /* 虧損或無流通時的紅色斑馬紋背景 */
      --alert-text: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; bg: var(--bg); color: var(--text1); padding: 20px; background-color: var(--bg); }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    h2 { color: var(--text1); font-weight: 600; }
    
    .panel { background: var(--panel-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
    
    /* 篩選器工具列 */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .filter-btn { padding: 6px 12px; border: 1px solid var(--border); background: #fff; border-radius: 20px; color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 排序工具列 */
    .sort-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 13px; color: var(--text3); }
    .sort-btn { padding: 5px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
    .sort-btn.active { border-color: var(--primary); color: var(--primary); font-weight: 500; }

    /* 表格樣式 */
    .item-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .item-table th, .item-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .item-table th { color: var(--text3); font-weight: 500; font-size: 13px; background: #fafbfc; }
    .r { text-align: right; }
    
    /* 數據行高亮與徽章 */
    tr.alert-row { background-color: var(--alert-bg) !important; color: var(--alert-text); }
    .price-val { font-weight: 600; font-family: monospace; font-size: 15px; }
    tr.alert-row .price-val { color: var(--alert-text); }
    
    .vol-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; font-family: monospace; }
    .vol-high { background: var(--badge-high); color: var(--text-high); }
    .vol-low { background: var(--badge-low); color: var(--text-low); }
    tr.alert-row .vol-badge { background: #fce4d6; color: var(--alert-text); }

    /* 佇列進度條 */
    .progress-container { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 8px; }
    .spinner { width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
  .filter-label { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 6px; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  #typeFilterBar { border-bottom: 1px solid var(--border); padding-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>🔮 魔晶石價值</h2>
    <div class="progress-container" id="progressInfo">
      <span class="spinner" id="progressSpinner" style="display:none;"></span>
      <span id="progressText">正在載入資料庫...</span>
    </div>
  </header>

  <div class="panel">
    <div class="filter-label">種類篩選：</div>
    <div class="filter-bar" id="classFilterBar">
      <button class="filter-btn active" id="class_btn_all" onclick="clearClassFilter()">全部種類</button>
    </div>

    <div class="filter-label" style="margin-top: 10px;">型號篩選：</div>
    <div class="filter-bar" id="typeFilterBar">
      <button class="filter-btn active" id="type_btn_all" onclick="clearTypeFilter()">全部型號</button>
    </div>

    <div class="sort-bar" style="margin-top: 20px;">
      <span>排序：</span>
      <button class="sort-btn" id="sort_price" onclick="toggleSort('price')">全區平均單價 ↕</button>
      <button class="sort-btn" id="sort_vol" onclick="toggleSort('vol')">7日全區成交量 ↕</button>
      <button class="sort-btn active" id="sort_none" onclick="toggleSort('none')">取消排序</button>
    </div>

    <table class="item-table">
      <thead>
        <tr>
          <th>魔晶石名稱</th>
          <th class="r">ID</th>
          <th class="r">收購價</th>
          <th class="r">平均單價 (7日)</th>
          <th class="r">成交量</th>
        </tr>
      </thead>
      <tbody id="itemTableBody">
        <tr><td colspan="5" style="text-align:center; padding: 40px; color:#999;">等待載入 mate_db.json...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 1. 靜態價格對照表
  const MAT_PRICES = {
    '壹型': 30,  '貳型': 60,  '參型': 90,  '肆型': 99,
    '伍型': 119, '陸型': 139, '柒型': 159, '捌型': 167,
    '玖型': 217, '拾型': 217, '拾壹型': 217, '拾貳型': 217
  };

  // 2. 繁中大區（陸行鳥）URL
  const REGION_URL = `https://universalis.app/api/v2/${encodeURIComponent('陸行鳥')}`;

  // 3. 全域狀態管理
  let gemDatabase = [];   
  let marketCache = {};   
  
  // 複選狀態管理 (使用 Set 方便處理新增與刪除)
  let selectedClasses = new Set(); // 存放勾選的種類，如 ['武略', '雄略']
  let selectedTypes = new Set();   // 存放勾選的型號，如 ['拾型', '拾貳型']
  
  let activeSort = 'none'; 
  let sortDirection = 1;   

  // 4. 初始化
  document.addEventListener('DOMContentLoaded', () => {
    renderTypeFilterButtons();
    initDatabase();
  });

  // 渲染型號按鈕 (第二排)
  function renderTypeFilterButtons() {
    const bar = document.getElementById('typeFilterBar');
    Object.keys(MAT_PRICES).forEach(type => {
      bar.innerHTML += `<button class="filter-btn" id="type_btn_${type}" onclick="toggleTypeFilter('${type}')">${type}</button>`;
    });
  }

  // 讀取本地 JSON 並自動動態分析「種類」
  async function initDatabase() {
    try {
      const response = await fetch('./FFXIV/mate_db.json');
      const data = await response.json();
      
      const detectedClasses = new Set();

      gemDatabase = Object.entries(data).map(([id, info]) => {
        // 從名稱中分離出種類（例如從 "武略魔晶石參型" 抓取 "武略"）
        const className = info.tw.split('魔晶石')[0];
        if (className) detectedClasses.add(className);

        return {
          id: id,
          name: info.tw,
          className: className,
          npcPrice: getNpcPrice(info.tw)
        };
      });

      // 根據偵測到的種類，動態動生第一排按鈕
      const classBar = document.getElementById('classFilterBar');
      Array.from(detectedClasses).sort().forEach(className => {
        classBar.innerHTML += `<button class="filter-btn" id="class_btn_${className}" onclick="toggleClassFilter('${className}')">${className}</button>`;
      });

      document.getElementById('progressText').innerText = '資料庫載入完成，開始排隊向 Universalis 查詢行情...';
      render();
      startFetchQueue();
    } catch (err) {
      document.getElementById('progressText').innerText = '讀取 mate_db.json 失敗。';
      console.error(err);
    }
  }

  function getNpcPrice(itemName) {
    for (const [type, price] of Object.entries(MAT_PRICES)) {
      if (itemName.endsWith(type)) return price;
    }
    return 0;
  }

  // 5. 核心複選邏輯控制
  function toggleClassFilter(className) {
    if (selectedClasses.has(className)) {
      selectedClasses.delete(className);
      document.getElementById(`class_btn_${className}`).classList.remove('active');
    } else {
      selectedClasses.add(className);
      document.getElementById(`class_btn_${className}`).classList.add('active');
    }
    
    // 如果有選任何種類，把 "全部種類" 取消高亮；反之則亮起
    if (selectedClasses.size > 0) {
      document.getElementById('class_btn_all').classList.remove('active');
    } else {
      document.getElementById('class_btn_all').classList.add('active');
    }
    render();
  }

  function clearClassFilter() {
    selectedClasses.clear();
    document.querySelectorAll('#classFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('class_btn_all').classList.add('active');
    render();
  }

  function toggleTypeFilter(type) {
    if (selectedTypes.has(type)) {
      selectedTypes.delete(type);
      document.getElementById(`type_btn_${type}`).classList.remove('active');
    } else {
      selectedTypes.add(type);
      document.getElementById(`type_btn_${type}`).classList.add('active');
    }
    
    if (selectedTypes.size > 0) {
      document.getElementById('type_btn_all').classList.remove('active');
    } else {
      document.getElementById('type_btn_all').classList.add('active');
    }
    render();
  }

  function clearTypeFilter() {
    selectedTypes.clear();
    document.querySelectorAll('#typeFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('type_btn_all').classList.add('active');
    render();
  }

  // 6. 排序與佇列抓取 (維持原大區設計)
  async function startFetchQueue() {
    const ids = gemDatabase.map(g => g.id);
    const chunks = [];
    for (let i = 0; i < ids.length; i += 20) {
      chunks.push(ids.slice(i, i + 20));
    }

    const spinner = document.getElementById('progressSpinner');
    spinner.style.display = 'inline-block';

    for (let i = 0; i < chunks.length; i++) {
      const chunk = chunks[i];
      document.getElementById('progressText').innerText = `正在查詢市場行情 (進度: ${i + 1}/${chunks.length} 組)...`;
      
      try {
        const res = await fetch(`${REGION_URL}/${chunk.join(',')}?entriesWithin=604800`);
        const data = await res.json();
        
        chunk.forEach(id => {
          const info = chunk.length === 1 ? data : (data.items ? data.items[id] : data[id]);
          if (info) {
            const history = info.recentHistory || [];
            const totals = history.reduce((acc, h) => {
              acc.totalGil += (h.pricePerUnit * h.quantity);
              acc.totalQty += h.quantity;
              return acc;
            }, { totalGil: 0, totalQty: 0 });

            const vol = totals.totalQty;
            const avgPrice = vol > 0 ? Math.round(totals.totalGil / vol) : 0;
            marketCache[id] = { price: avgPrice, vol: vol };
          }
        });
        render(); 
      } catch (e) {
        console.error(e);
      }
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
    spinner.style.animation = 'none';
    spinner.style.display = 'none';
    document.getElementById('progressText').innerText = '全區 7 日行情更新完畢 (靜態緩存中)';
  }

  function toggleSort(type) {
    if (type === 'none') {
      activeSort = 'none';
    } else {
      if (activeSort === type) {
        sortDirection = -sortDirection;
      } else {
        activeSort = type;
        sortDirection = -1;
      }
    }
    document.querySelectorAll('.sort-bar .sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`sort_${type}`).classList.add('active');
    const arrow = sortDirection === 1 ? '▲' : '▼';
    document.getElementById('sort_price').innerText = `全區平均單價 ${activeSort === 'price' ? arrow : '↕'}`;
    document.getElementById('sort_vol').innerText = `7日全區成交量 ${activeSort === 'vol' ? arrow : '↕'}`;
    render();
  }

  // 7. 核心表格渲染：多重交集過濾
  function render() {
    const tbody = document.getElementById('itemTableBody');
    
    // 多重交集過濾
    let displayList = gemDatabase.filter(item => {
      // 條件 1: 種類過濾 (選中的種類必須包含該項目的 className，若沒選則預設全過)
      const matchClass = selectedClasses.size === 0 || selectedClasses.has(item.className);
      
      // 條件 2: 型號過濾
      let matchType = selectedTypes.size === 0;
      if (!matchType) {
        for (const type of selectedTypes) {
          if (item.name.endsWith(type)) {
            matchType = true;
            break;
          }
        }
      }
      
      return matchClass && matchType;
    });

    // 排序
    if (activeSort === 'price') {
      displayList.sort((a, b) => ( (marketCache[a.id]?.price || 0) - (marketCache[b.id]?.price || 0) ) * sortDirection);
    } else if (activeSort === 'vol') {
      displayList.sort((a, b) => ( (marketCache[a.id]?.vol || 0) - (marketCache[b.id]?.vol || 0) ) * sortDirection);
    }

    // 渲染資料行
    tbody.innerHTML = displayList.map(item => {
      const cache = marketCache[item.id];
      const hasData = cache !== undefined;
      const p = hasData ? cache.price : 0;
      const v = hasData ? cache.vol : 0;
      
      const isLoss = hasData && ((p * 0.95) <= item.npcPrice || v === 0);

      const pStr = hasData 
        ? (p > 0 ? `<span class="price-val">${p.toLocaleString()}</span>` : '<span style="color:#aaa">0</span>') 
        : '<span style="color:#ccc; font-size:12px;">Loading...</span>';
        
      const vStr = hasData 
        ? `<span class="vol-badge ${v > 50 ? 'vol-high' : 'vol-low'}">${v}</span>` 
        : '<span style="color:#ccc; font-size:12px;">Loading...</span>';

      return `
        <tr class="${isLoss ? 'alert-row' : ''}">
          <td><div style="font-weight:500;">${item.name}</div></td>
          <td class="r" style="font-size:12px; color:#999; font-family:monospace;">#${item.id}</td>
          <td class="r" style="font-weight:500; font-family:monospace;">${item.npcPrice}</td>
          <td class="r">${pStr}</td>
          <td class="r">${vStr}</td>
        </tr>
      `;
    }).join('');

    if (displayList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color:#999;">沒有符合此多重篩選條件的魔晶石</td></tr>`;
    }
  }
</script>

</body>
</html>
