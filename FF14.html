<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/LivlyShop/favicon.ico">
<title>FF14 僱員市場分析 · 巴哈姆特</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #eeece9;
    --text: #1c1c1a; --text2: #6b6b67; --text3: #a09f9b;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --radius: 8px; --radius-lg: 12px;
    --danger-bg: #fcebeb; --danger-text: #a32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c; --bg2: #272724; --bg3: #303030;
      --text: #e8e6e1; --text2: #9a9890; --text3: #5e5d58;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --danger-bg: #3a1414; --danger-text: #f09595;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 24px 16px; }
  .app { max-width: 780px; margin: 0 auto; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
  .title { font-size: 20px; font-weight: 600; }
  .subtitle { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .btn { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 9px 18px; font-size: 14px; cursor: pointer; color: var(--text2); border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
  .panel { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; position: relative; }
  .search-row input { flex: 1; padding: 9px 13px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); outline: none; }
  .dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); z-index: 100; max-height: 230px; overflow-y: auto; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .dropdown.show { display: block; }
  .dd-item { padding: 9px 13px; font-size: 14px; cursor: pointer; border-bottom: 0.5px solid var(--border); }
  .dd-item:hover { background: var(--bg2); }
  .dd-sub { font-size: 12px; color: var(--text2); }
  
  /* 排序列樣式 */
  .sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
  .sort-btn { padding: 4px 12px; font-size: 12px; border-radius: 20px; border: 0.5px solid var(--border); background: transparent; cursor: pointer; color: var(--text2); transition: all 0.12s; }
  .sort-btn.active { background: var(--bg2); color: var(--text); border-color: var(--border2); }

  .item-table { width: 100%; border-collapse: collapse; }
  .item-table th, .item-table td { padding: 10px; font-size: 14px; border-bottom: 0.5px solid var(--border); text-align: left; }
  .r { text-align: right !important; }
  .vol-badge { padding: 2px 9px; border-radius: 20px; font-size: 12px; }
  .vol-high { background: #EAF3DE; color: #3B6D11; }
  .vol-low { background: #f1f0ec; color: #5F5E5A; }
  .inline-edit { width: 100%; padding: 4px; border: 1px solid transparent; background: transparent; color: inherit; }
  .inline-edit:focus { border-color: var(--border2); background: var(--bg); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 200; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--bg); padding: 24px; border-radius: var(--radius-lg); width: 320px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <div class="title">⚔️ FF14 僱員市場分析</div>
      <div class="subtitle">繁中版・巴哈姆特伺服器 · 資料來源：Universalis & Teamcraft</div>
    </div>
    <div class="header-right">
      <span id="lastRefresh" style="font-size:12px; color:var(--text3); margin-right:10px;"></span>
      <button class="btn btn-primary" onclick="refreshAll()">↻ 重新整理市場價</button>
    </div>
  </div>

  <div class="tabs" id="tabBar"></div>
  <div id="tabContent"></div>
</div>

<div class="modal-backdrop" id="renameModal">
  <div class="modal">
    <h3>更改僱員名稱</h3>
    <input type="text" id="renameInput" style="width:100%; margin: 10px 0; padding:8px;">
    <div style="text-align:right;">
      <button class="btn" onclick="closeRename()">取消</button>
      <button class="btn btn-primary" onclick="confirmRename()">確認</button>
    </div>
  </div>
</div>

<script>
const SERVER = 4033; 
const UNI = 'https://universalis.app/api/v2';
const PATH_TW = './FFXIV/tw-items.json';
const PATH_INTL = './FFXIV/items.json';

let db_tw = {};
let db_intl = {};
let marketCache = JSON.parse(localStorage.getItem('ff14_market_cache') || '{}');
let customTranslations = JSON.parse(localStorage.getItem('ff14_custom_trans') || '{}');

// 排序狀態
let activeSort = 'none'; // none, price, vol
let sortDir = { price: 'asc', vol: 'desc' };

let state = JSON.parse(localStorage.getItem('ff14retainer_v3') || 'null') || {
  retainers: [
    { name: '僱員一', items: [] },
    { name: '僱員二', items: [] },
    { name: '僱員三', items: [] }
  ],
  activeTab: 0
};

async function initDB() {
  try {
    const [resTw, resIntl] = await Promise.all([
      fetch(PATH_TW).then(r => r.json()),
      fetch(PATH_INTL).then(r => r.json())
    ]);
    db_tw = resTw;
    db_intl = resIntl;
    render();
    refreshMarketDisplay();
  } catch (e) {
    alert("無法讀取 JSON 檔案，請確認路徑或是否在伺服器環境執行。");
  }
}

function save() {
  localStorage.setItem('ff14retainer_v3', JSON.stringify(state));
  localStorage.setItem('ff14_custom_trans', JSON.stringify(customTranslations));
  localStorage.setItem('ff14_market_cache', JSON.stringify(marketCache));
}

async function doSearch(q) {
  const dd = document.getElementById('dd');
  if (!q.trim()) { dd.classList.remove('show'); return; }
  dd.innerHTML = '<div class="dd-item">搜尋中…</div>';
  dd.classList.add('show');

  const results = [];
  const query = q.toLowerCase();

  for (const [id, data] of Object.entries(db_tw)) {
    if (data.tw && data.tw.toLowerCase().includes(query)) {
      results.push({ id, name: data.tw, lang: 'TW' });
    }
  }

  if (results.length < 10) {
    for (const [id, data] of Object.entries(db_intl)) {
      if (results.some(r => r.id === id)) continue;
      const match = ['en', 'ja', 'de', 'fr'].find(l => data[l] && data[l].toLowerCase().includes(query));
      if (match) results.push({ id, name: data[match], lang: match.toUpperCase() });
    }
  }

  if (results.length === 0) {
    dd.innerHTML = '<div class="dd-item">找不到道具</div>';
    return;
  }

  dd.innerHTML = results.slice(0, 15).map(item => `
    <div class="dd-item" onmousedown="addItem(event,'${item.id}','${item.name.replace(/'/g, "\\'")}', '${item.lang}')">
      <span>${item.name}</span>
      <span class="dd-sub" style="float:right">#${item.id} (${item.lang})</span>
    </div>
  `).join('');
}

function addItem(e, id, originalName, lang) {
  e.preventDefault();
  const r = state.retainers[state.activeTab];
  if (r.items.find(it => it.id === id)) return;

  // 使用 unshift 讓新道具排在最前面
  r.items.unshift({ id, name: originalName });

  if (lang !== 'TW' && !customTranslations[id]) {
    customTranslations[id] = originalName;
  }

  activeSort = 'none'; // 新增物品時重設排序，以顯示在最上方
  save();
  document.getElementById('searchInput').value = '';
  fetchMarket([id]);
  render();
}

// ─── 排序處理 ──────────────────────────────────────────────────────────
function setSort(key) {
  if (activeSort === key) {
    sortDir[key] = sortDir[key] === 'asc' ? 'desc' : 'asc';
  } else {
    activeSort = key;
  }
  render();
}

function getSortedItems(items) {
  if (activeSort === 'none') return items;
  
  const sorted = [...items];
  const dir = sortDir[activeSort] === 'asc' ? 1 : -1;

  return sorted.sort((a, b) => {
    const ma = marketCache[a.id] || {};
    const mb = marketCache[b.id] || {};

    if (activeSort === 'price') {
      const pa = ma.price ?? (dir === 1 ? Infinity : -1);
      const pb = mb.price ?? (dir === 1 ? Infinity : -1);
      return (pa - pb) * dir;
    } else if (activeSort === 'vol') {
      const va = ma.vol ?? -1;
      const vb = mb.vol ?? -1;
      return (va - vb) * dir;
    }
    return 0;
  });
}

function render() {
  renderTabs();
  renderContent();
}

function renderTabs() {
  const retainerTabs = state.retainers.map((r, i) => `
    <button class="tab ${state.activeTab === i ? 'active' : ''}" onclick="switchTab(${i})">
      ${r.name} <span onclick="event.stopPropagation(); openRename(${i})">✎</span>
    </button>
  `).join('');
  const customTab = `<button class="tab ${state.activeTab === 'custom' ? 'active' : ''}" onclick="switchTab('custom')" style="margin-left:auto">✦ 自訂翻譯</button>`;
  document.getElementById('tabBar').innerHTML = retainerTabs + customTab;
}

function renderContent() {
  if (state.activeTab === 'custom') { renderCustomTab(); return; }
  const r = state.retainers[state.activeTab];
  const sorted = getSortedItems(r.items);
  
  document.getElementById('tabContent').innerHTML = `
    <div class="panel">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="輸入名稱搜尋（繁中、英、日）…" oninput="doSearch(this.value)" onblur="hideDD()">
        <div class="dropdown" id="dd"></div>
      </div>
      
      <div class="sort-bar">
        <span>排序方式：</span>
        <button class="sort-btn ${activeSort === 'price' ? 'active' : ''}" onclick="setSort('price')">
          最低單價 ${activeSort === 'price' ? (sortDir.price === 'asc' ? '↑' : '↓') : ''}
        </button>
        <button class="sort-btn ${activeSort === 'vol' ? 'active' : ''}" onclick="setSort('vol')">
          7日成交量 ${activeSort === 'vol' ? (sortDir.vol === 'asc' ? '↑' : '↓') : ''}
        </button>
        ${activeSort !== 'none' ? '<button class="sort-btn" onclick="activeSort=\'none\';render()">重設</button>' : ''}
      </div>

      <table class="item-table">
        <thead><tr><th>道具名稱</th><th>ID</th><th class="r">最低價</th><th class="r">7日銷量</th><th></th></tr></thead>
        <tbody>${sorted.map(it => renderRow(it)).join('')}</tbody>
      </table>
    </div>`;
}

function renderRow(item) {
  const displayName = customTranslations[item.id] || (db_tw[item.id] ? db_tw[item.id].tw : item.name);
  const m = marketCache[item.id] || {};
  return `<tr>
    <td><div style="font-weight:500">${displayName}</div></td>
    <td style="color:#a09f9b; font-size:12px">#${item.id}</td>
    <td class="r">${m.price ? m.price.toLocaleString() + ' gil' : '---'}</td>
    <td class="r"><span class="vol-badge ${m.vol > 20 ? 'vol-high' : 'vol-low'}">${m.vol || 0}</span></td>
    <td class="r"><button class="btn" onclick="removeItem('${item.id}')">✕</button></td>
  </tr>`;
}

function renderCustomTab() {
  const ids = Object.keys(customTranslations);
  document.getElementById('tabContent').innerHTML = `
    <div class="panel">
      <h3>自訂翻譯管理</h3>
      <table class="item-table">
        <thead><tr><th>ID</th><th>顯示名稱 (點擊編輯)</th><th>操作</th></tr></thead>
        <tbody>${ids.map(id => `
          <tr>
            <td>#${id}</td>
            <td><input class="inline-edit" value="${customTranslations[id]}" onchange="updateTrans('${id}', this.value)"></td>
            <td><button class="btn" onclick="deleteTrans('${id}')">刪除</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function updateTrans(id, val) { customTranslations[id] = val; save(); render(); }
function deleteTrans(id) { delete customTranslations[id]; save(); render(); }
function switchTab(i) { state.activeTab = i; activeSort = 'none'; render(); }
function hideDD() { setTimeout(() => { if(document.getElementById('dd')) document.getElementById('dd').classList.remove('show')}, 200); }
function removeItem(id) {
  state.retainers[state.activeTab].items = state.retainers[state.activeTab].items.filter(i => i.id !== id);
  save(); render();
}

async function fetchMarket(ids) {
  if (!ids.length) return;
  try {
    const res = await fetch(`${UNI}/${SERVER}/${ids.join(',')}?entriesWithin=604800`);
    const data = await res.json();
    const update = (id, d) => {
      marketCache[id] = {
        price: d.listings?.[0]?.pricePerUnit || null,
        vol: d.recentHistory?.reduce((acc, cur) => acc + cur.quantity, 0) || 0
      };
    };
    if (ids.length === 1) update(ids[0], data);
    else Object.keys(data.items).forEach(id => update(id, data.items[id]));
    save(); render();
  } catch (e) { console.error("市場資料抓取失敗"); }
}

function refreshAll() {
  const allIds = [...new Set(state.retainers.flatMap(r => r.items.map(i => i.id)))];
  fetchMarket(allIds);
  const now = new Date();
  document.getElementById('lastRefresh').textContent = `更新: ${now.getHours()}:${now.getMinutes()}`;
}

let renamingIdx = null;
function openRename(i) {
  renamingIdx = i;
  document.getElementById('renameInput').value = state.retainers[i].name;
  document.getElementById('renameModal').classList.add('show');
}
function closeRename() { document.getElementById('renameModal').classList.remove('show'); }
function confirmRename() {
  const val = document.getElementById('renameInput').value.trim();
  if(val) { state.retainers[renamingIdx].name = val; save(); render(); }
  closeRename();
}

initDB();
</script>
</body>
</html>
